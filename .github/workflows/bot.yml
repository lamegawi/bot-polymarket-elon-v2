# 🤖 Bot Polymarket — 24/7 con GitHub Actions + runner propio (Windows)
# Se ejecuta en el RUNNER SELF-HOSTED de tu PC (IP España) → MODO REAL OK.
# shell: cmd  (cmd no tiene política de scripts → funciona como servicio de Windows)

name: Bot Polymarket Elon V2 (48h)

on:
  schedule:
    - cron: '4-59/15 * * * *'      # cada 15 min, escalonado
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-v2-48h
  cancel-in-progress: false

jobs:
  bot:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - name: Espera escalonada (no saturar fuentes)
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -Command "Start-Sleep -Seconds 120"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Comprobar Python (usar el del PC)
        shell: cmd
        run: python --version

      - name: Instalar dependencias
        shell: cmd
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openpyxl py-clob-client-v2

      - name: Ejecutar una pasada del bot (MODO REAL)
        shell: cmd
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_WALLET_ADDRESS: ${{ secrets.POLY_WALLET_ADDRESS }}
          REAL_CONFIRMADO: ${{ secrets.REAL_CONFIRMADO }}
        run: python -u bot.py --modo real --excel

      - name: Guardar estado (commit de los datos)
        shell: cmd
        run: |
          git config user.name "bot-poly-v2-48h"
          git config user.email "bot-poly-v2-48h@users.noreply.github.com"
          git add -A
          git pull --rebase --autostash "https://x-access-token:%GITHUB_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" HEAD:main >nul 2>&1
          git diff --cached --quiet
          if errorlevel 1 git commit -m "estado bot v2-48h %DATE% %TIME%"
          git push "https://x-access-token:%GITHUB_TOKEN%@github.com/%GITHUB_REPOSITORY%.git" HEAD:main
